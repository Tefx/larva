name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: pi-larva-release
          path: ${{ runner.temp }}/release
      - run: npm publish --provenance "$RUNNER_TEMP/release/pi-larva.tgz"
