name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  local-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Install locked Python dependencies
        run: uv sync --locked --python 3.12 --group dev
      - name: Verify local schema, typing, validation and drift
        run: |
          uv run --locked --python 3.12 --group dev pytest -q \
            tests/core/test_schema_validation.py tests/core/test_validate.py \
            tests/canonical_cutover/test_hard_cutover_readiness.py

  pi-native-runtime:
    runs-on: macos-15
    needs: local-schema
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PI_BIN: ${{ github.workspace }}/contrib/pi-extension/node_modules/.bin/pi
      LARVA_TEST_PI_CODING_AGENT: ${{ github.workspace }}/contrib/pi-extension/node_modules/@earendil-works/pi-coding-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.7.0"
      - name: Install locked project dependencies
        run: |
          uv sync --locked --python 3.12 --group dev
          npm --prefix contrib/pi-extension ci
      - name: Verify native-owned Python wheel and backend seam
        run: |
          env -u VIRTUAL_ENV -u UV_PROJECT_ENVIRONMENT -u PYTHONPATH UV_PYTHON_DOWNLOADS=never \
            uv run --locked --python 3.12 --group dev pytest -q \
            tests/shell/test_pi_launcher_contract.py tests/shell/test_pi_model_map_draft_contract.py
      - name: Verify complete native runtime inventory
        run: |
          env -u VIRTUAL_ENV -u UV_PROJECT_ENVIRONMENT -u PYTHONPATH UV_PYTHON_DOWNLOADS=never \
            uv run --locked --python 3.12 --group dev pytest -q tests/shell/test_pi_extension_real_runtime.py
      - name: Verify retained contracts and all Node regressions
        run: |
          env -u VIRTUAL_ENV -u UV_PROJECT_ENVIRONMENT -u PYTHONPATH UV_PYTHON_DOWNLOADS=never \
            uv run --locked --python 3.12 --group dev pytest -q \
            tests/shell/test_pi_extension_contract.py tests/shell/test_pi_extension_subagent_ux.py \
            tests/shell/test_pi_extension_subagent_model_isolation.py \
            tests/shell/test_pi_agent_persona_switch_policy_contract.py tests/shell/test_pi_idle_callback_identity.py \
            tests/shell/test_pi_subagent_activity.py tests/shell/test_repo_local_ci_gate.py
          for f in contrib/pi-extension/test-*.mjs; do node "$f"; done
          node scripts/pi-extension-runtime-smoke.mjs --scenario capability-gates
      - name: Verify pinned full Invar scan
        run: |
          env -u VIRTUAL_ENV -u UV_PROJECT_ENVIRONMENT -u PYTHONPATH UV_PYTHON_DOWNLOADS=never \
            uvx --python 3.12 invar-tools==1.20.3 guard --all
